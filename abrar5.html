<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Gallery</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      padding: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      padding: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    /* Lightbox style */
    .lightbox {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
    }

    .lightbox img {
      max-width: 90%;
      max-height: 80%;
      border: 4px solid white;
      border-radius: 10px;
    }

    .lightbox:active {
      display: none;
    }
  </style>
</head>
<body>

  <h1>SUITS</h1>

    <div class="gallery">
        <img src="suit 1.jpg" alt="Image 10">
        <img src="suit 2.jpg" alt="Image 9">
        <img src="suit 3.jpg" alt="Image 1" >
        <img src="suit 4.jpg" alt="Image 2">
        <img src="suit 5.jpg" alt="Image 3">
        <img src="suit 6.jpg" alt="Image 4">
        <img src="suit7.jpg" alt="Image 5">
        <img src="suit8.jpg" alt="Image 6">
        <img src="suit9.jpg" alt="Image 7" >
        <img src="suit10.jpg" alt="Image 12">   
        <img src="suit11.jpg" alt="Image 11" >
        <img src="suit12.jpg" alt="Image 12" >
    
      </div>
    

  
  <div class="lightbox" id="lightbox">
    <img src="" id="lightbox-img">
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const galleryImages = document.querySelectorAll('.gallery img');

    galleryImages.forEach(img => {
      img.addEventListener('click', () => {
        lightbox.style.display = 'flex';
        lightboxImg.src = img.src;
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.style.display = 'none';
    });
  </script>

</body>
</html>
